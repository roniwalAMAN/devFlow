name: DevFlow CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow_secret
          POSTGRES_DB: devflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.25.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @devflow/database prisma:validate
        env:
          DATABASE_URL: postgresql://devflow:devflow_secret@localhost:5432/devflow_test?schema=public

      - name: Generate Prisma Client & Run Migrations
        run: |
          pnpm --filter @devflow/database prisma:generate
          pnpm --filter @devflow/database prisma:migrate
        env:
          DATABASE_URL: postgresql://devflow:devflow_secret@localhost:5432/devflow_test?schema=public

      - name: Seed Database
        run: pnpm --filter @devflow/database seed
        env:
          DATABASE_URL: postgresql://devflow:devflow_secret@localhost:5432/devflow_test?schema=public

      - name: TypeScript Typecheck (All Packages)
        run: pnpm type-check

      - name: Run Integration & Regression Test Suite
        run: pnpm test
        env:
          DATABASE_URL: postgresql://devflow:devflow_secret@localhost:5432/devflow_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: devflow-super-secret-jwt-key-for-local-dev-min-32-chars
          JWT_REFRESH_SECRET: devflow-super-secret-jwt-refresh-key-local-32-chars
          ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Build Database & Shared Packages
        run: |
          pnpm --filter @devflow/database build
          pnpm --filter @devflow/shared build

      - name: Build Server
        run: pnpm --filter @devflow/server build

      - name: Build Next.js Web App
        run: pnpm --filter @devflow/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
